# PR 合并后回写任务状态：PR 合入 main 后，把对应任务 Issue 的收尾动作
# 机械化——打 state:merged 标签、摘掉其余 state: 标签、发 PR_MERGED 评论、
# 关闭 Issue。协议里这一步原本由 Muse 1 手工发（agent-protocol.md 第二
# 节第 12 类消息），TASK-07 起由本工作流自动执行，评论的机器可读头
# from 记为 github-actions（自动化执行者），Muse 1 只做最终汇总
# （dispatch-rules.md 第四节）。
#
# 关联 Issue 的解析顺序（取第一个命中）：
#   1. PR 正文里的 Closes / Fixes / Resolves #N（GitHub 原生关闭关键词，
#      命中时 Issue 在合并瞬间已被 GitHub 自动关闭，本工作流补标签与评论）；
#   2. PR 正文里的 agent 消息头 task: #N；
#   3. 分支名 agent/task-<N>-…。
# 三者都解析不到 → 只记日志跳过（非任务 PR，如人工提的杂项 PR，不动）。
#
# 安全阀：
#   - 只处理 merged == true 且 base 为 main 的 PR；
#   - Issue 已关闭且已带 state:merged 时整体跳过，重复触发不重复评论；
#   - 只动解析出的那一个 Issue，不批量扫其他 Issue。
#
# 触发（两条路，同一套逻辑）：
#   - PR 关闭且 merged == true、base 为 main（手动在网页上合并时走这条）；
#   - auto-merge 合并成功后显式 workflow_dispatch（填 PR 号）。
#   第二条是必需的：auto-merge 用默认 GITHUB_TOKEN 合并，GitHub 不会为
#   该 token 触发的事件再启动新工作流，pull_request closed 事件被抑制
#   （2026-11-14 实测：PR #31 合入后本工作流 0 次运行）。workflow_dispatch
#   明确豁免这条限制，所以由 auto-merge 显式触发。
#   workflow_dispatch 路径下事件里没有 pull_request 对象，PR 正文、
#   分支名、合并提交一律从 API 取，并校验 PR 确实已合入 main。

name: pr-merged-writeback

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '已合入 main 的 PR 编号'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  writeback:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: 回写任务状态并关闭 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          PR_BODY_EVENT: ${{ github.event.pull_request.body }}
          HEAD_REF_EVENT: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA_EVENT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')

          # 两条触发路径取 PR 编号：pull_request 事件取事件里的编号，
          # workflow_dispatch 取 inputs.pr_number。
          PR_NUMBER="${PR_NUMBER_EVENT:-$PR_NUMBER_INPUT}"
          test -n "$PR_NUMBER" || { echo "未取到 PR 编号，跳过"; exit 0; }
          PR_BODY="$PR_BODY_EVENT"
          HEAD_REF="$HEAD_REF_EVENT"
          MERGE_SHA="$MERGE_SHA_EVENT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # 事件里没有 pull_request 对象，从 API 取 PR，并校验它确实已合入 main。
            PR_JSON="$(curl -sS "${AUTH[@]}" "$API/pulls/$PR_NUMBER")"
            MERGED="$(echo "$PR_JSON" | jq -r '.merged')"
            BASE="$(echo "$PR_JSON" | jq -r '.base.ref')"
            if [ "$MERGED" != "true" ] || [ "$BASE" != "main" ]; then
              echo "PR #$PR_NUMBER 未合入 main（merged=$MERGED，base=$BASE），跳过"; exit 0
            fi
            PR_BODY="$(echo "$PR_JSON" | jq -r '.body // ""')"
            HEAD_REF="$(echo "$PR_JSON" | jq -r '.head.ref')"
            MERGE_SHA="$(echo "$PR_JSON" | jq -r '.merge_commit_sha // ""')"
          fi

          ISSUE_NUMBER="$(echo "$PR_BODY" | grep -ioE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)"
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$(echo "$PR_BODY" | grep -oE 'task:[[:space:]]*#[0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)"
          fi
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$(echo "$HEAD_REF" | sed -nE 's#^agent/task-([0-9]+)(-|$).*#\1#p' | head -n 1 || true)"
          fi
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "PR #$PR_NUMBER 解析不到关联任务 Issue，跳过回写"; exit 0
          fi
          echo "关联任务 Issue：#$ISSUE_NUMBER"

          ISSUE_JSON="$(curl -sS "${AUTH[@]}" "$API/issues/$ISSUE_NUMBER")"
          ISSUE_STATE="$(echo "$ISSUE_JSON" | jq -r '.state')"
          ISSUE_LABELS="$(echo "$ISSUE_JSON" | jq -r '.labels[].name')"
          if [ "$ISSUE_STATE" = "closed" ] && echo "$ISSUE_LABELS" | grep -qx 'state:merged'; then
            echo "Issue #$ISSUE_NUMBER 已关闭且已回写，跳过"; exit 0
          fi

          # 摘掉其余 state: 标签（标签名在路径里要 URL 编码）。
          for LBL in $ISSUE_LABELS; do
            case "$LBL" in
              state:merged) ;;
              state:*)
                ENC="$(jq -rn --arg v "$LBL" '$v | @uri')"
                curl -sS -X DELETE "${AUTH[@]}" "$API/issues/$ISSUE_NUMBER/labels/$ENC" > /dev/null || true
                echo "摘除标签 $LBL"
                ;;
            esac
          done

          # 打上 state:merged。
          curl -sS -X POST "${AUTH[@]}" "$API/issues/$ISSUE_NUMBER/labels" \
            --data-binary '{"labels": ["state:merged"]}' > /dev/null
          echo "已打 state:merged"

          # PR_MERGED 评论（机器可读头 + 人可读正文）。
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "<!-- agent-msg: PR_MERGED, task: #$ISSUE_NUMBER, from: github-actions, at: $NOW -->"
            echo "PR_MERGED（自动化回写）：PR #$PR_NUMBER 已合入 main。"
            echo
            echo "- 合并提交：\`$MERGE_SHA\`"
            echo "- 任务状态：state:merged，Issue 随本文关闭"
            echo "- 说明：本评论由 pr-merged-writeback 工作流自动发出（TASK-07），汇总口径见 dispatch-rules.md 第四节，由 Muse 1 汇总时引用。"
          } > /tmp/writeback.md
          jq -n --rawfile body /tmp/writeback.md '{body: $body}' \
            | curl -sS -X POST "${AUTH[@]}" "$API/issues/$ISSUE_NUMBER/comments" --data-binary @- > /dev/null
          echo "已发 PR_MERGED 评论"

          # 关闭 Issue（若 GitHub 的 Closes 关键词已先关掉，这里幂等无副作用）。
          curl -sS -X PATCH "${AUTH[@]}" "$API/issues/$ISSUE_NUMBER" \
            --data-binary '{"state": "closed", "state_reason": "completed"}' > /dev/null
          echo "Issue #$ISSUE_NUMBER 已关闭。回写完成。"
