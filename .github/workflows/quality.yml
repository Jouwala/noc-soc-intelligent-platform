# 离线质量检查（第一轮重构批 E；第二轮 §11.1 加 pytest 离线集）
#
# 与本地 ops/quality/check_all.ps1 同一份检查（离线部分），跑在 windows-latest
# 上——后端有 Windows 专用代码，Linux runner 会误报。
#
# 不访问 UME、eFlow、生产库、邮箱、WhatsApp、内网地址；pytest 只跑离线集
# `pytest -m "not live"`（live 标记见 apps/my_app/tests/conftest.py 与
# pyproject.toml，live 测试的跑法是直接 `python tests/xxx.py`）。
#
# 每个 job 都写明 working-directory（defaults.run.working-directory）。

name: quality

on:
  # 2026-11-24 流程提速批：agent/* 推送不再另起一套 quality（同 head 的
  # pull_request 运行已覆盖它）；main 的 push 仍跑，供合并后兜底。
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  compileall:
    name: compileall（apps + ops/deploy）
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall
        run: python -m compileall -q apps ops/deploy

  ruff:
    name: ruff E9,F821（my_app）
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/my_app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install ruff
      - name: ruff E9,F821
        run: python -m ruff check backend --select E9,F821

  portal:
    name: 门户 lint / test / 文档守卫
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/portal
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: lint（tsc --noEmit）
        run: npm run lint
      - name: test
        run: npm test
      - name: 文档守卫 check:docs
        run: npm run check:docs

  my-app-docs:
    name: my_app 文档一致性守卫
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/my_app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 文档一致性守卫
        run: python tests/test_doc_consistency.py

  pytest:
    name: pytest 离线集（-m "not live"）
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/my_app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: pytest 离线集
        run: python -m pytest tests -m "not live"

  # 以下是 TASK-01 新增作业（2026-11-14），不改既有作业。
  # 目的：agent-worker 与 control-plane（调度器 + 分派模块）的离线测试此前
  # 完全没进 CI，坏掉也没人拦。
  agent-tests:
    name: agent-worker + control-plane 调度/分派测试
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 pytest
        run: python -m pip install pytest
      - name: pytest（agent-worker + control-plane）
        # -p no:cacheprovider：runner 工作区不留 .pytest_cache，避免脏文件干扰
        # 后续守卫；三个目录按目录跑（不靠 rootdir 自动发现），并显式带上
        # dispatch/tests：TASK-07 的分派幂等测试不能漏跑；
        # agent-worker-linux/tests：Issue #73 沙箱 Worker 包（fake GitHub ref-CAS 并发）。
        run: python -m pytest apps/agent-worker/tests apps/control-plane/backend/tests apps/control-plane/backend/dispatch/tests apps/agent-worker-linux/tests -q -p no:cacheprovider

  agent-linux-process-tests:
    name: agent-worker Linux 进程/信号测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 pytest
        run: python -m pip install pytest
      - name: pytest（POSIX 进程组 / SIGTERM / SIGKILL 真实执行）
        # Windows 上这些测试只能走模拟分支；放到 ubuntu-latest 才是真实进程/
        # 信号语义（os.killpg、SIGKILL 行为与 Windows 完全不同）；
        # 同时跑 agent-worker-linux 包测试（Linux 是它的第一运行目标）。
        run: python -m pytest apps/agent-worker/tests apps/agent-worker-linux/tests -q -p no:cacheprovider

  # Issue #150 新增作业（2026-11-18），不改既有作业。
  # 目的：.ps1 文件之前没有任何语法检查进 CI——smoke-local.ps1 这类
  # 冒烟脚本坏掉要到 D:\02 真跑才发现。本作业只做静态解析，不执行。
  ps-syntax:
    name: PowerShell 语法检查（ops/*.ps1）
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: 解析全部 .ps1（语法错误即失败）
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 -Path ops | Where-Object { $_.FullName -notmatch 'node_modules' }
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::PS 语法错误：$($e.Message)"; $failed++ }
          }
          if ($failed -gt 0) { throw "$failed 个 PowerShell 语法错误" }
          Write-Host "已解析 $($files.Count) 个 .ps1 文件，0 错误"
      - name: UTF-8 BOM 检查（PowerShell 5.1 必需）
        # 语义检查与 pre-commit 同一份脚本：缺 BOM 时 PS 5.1 按 ANSI 解码，
        # UTF-8 中文注释会被拆散并吞掉后续引号/括号，整份脚本语法崩掉。
        # 2026-11-19 冒烟 PR #182 实测（start_all.ps1 因此 exit 1），见脚本头注释。
        run: node ops/deploy/check-ps1-bom.mjs

  # Issue #146 新增作业（2026-11-18），不改既有作业。
  # 目的：ops/deploy/*.mjs 之前没有任何加载检查进 CI——build-zip.mjs
  # 引用不存在的导出（fc94778）带着绿 CI 提交了。node --check 只验语法、
  # 抓不到缺导出，必须真正加载（回归测试 + 干跑）才抓得到。
  deploy-mjs-load:
    name: ops/deploy .mjs 加载检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check（语法）
        run: |
          for f in ops/deploy/*.mjs ops/deploy/lib/*.mjs; do node --check "$f" || exit 1; done
      - name: 回归测试（加载 zip-package）
        run: node --test ops/deploy/lib/zip-package.test.mjs ops/deploy/lib/zip-dir.test.mjs
      - name: build-zip 干跑（加载 build-zip + 全模块）
        run: node ops/deploy/build-zip.mjs --mode source --platform linux-x64 --dry-run

  # Issue #189 新增作业（2026-11-20），不改既有作业。
  # 目的：deploy-mjs-load 只跑 ubuntu-latest，#179 的 zip-dir 符号链接 /
  # 可执行位两处回归直到 windows-latest 的 release-build 才爆出来。
  # 本作业与 deploy-mjs-load 跑相同命令（node --check、回归测试、build-zip
  # 干跑），只把平台换成 Windows：runner 用 windows-latest，build-zip
  # 干跑参数用 --platform win-x64；shell 仍用 bash（windows-latest 自带
  # Git Bash，for 循环写法与 ubuntu 作业完全一致）。
  deploy-mjs-load-windows:
    name: ops/deploy .mjs 加载检查（Windows）
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check（语法）
        run: |
          for f in ops/deploy/*.mjs ops/deploy/lib/*.mjs; do node --check "$f" || exit 1; done
      - name: 回归测试（加载 zip-package）
        run: node --test ops/deploy/lib/zip-package.test.mjs ops/deploy/lib/zip-dir.test.mjs
      - name: build-zip 干跑（加载 build-zip + 全模块）
        run: node ops/deploy/build-zip.mjs --mode source --platform win-x64 --dry-run
