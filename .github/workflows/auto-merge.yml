# 自动合并：CI 全绿 + smoke-passed 标签 + 独立审核通过的 PR 自动合入 main，
# 不经过 Muse、无需人工点批准。
#
# 双门禁（Phase 2 P2-3 #132）：QA 与独立审核针对同一 head SHA 才合入，
# 任一门禁失败即阻断——
#   - QA 门禁：smoke-passed 标签 + 冒烟结果 SHA 绑定（见下）；
#   - 审核门禁：PR 评论里最后一条 review-result 标记须为 passed，且
#     标记的 pr 等于本 PR、sha 等于当前 head（判定见
#     apps/control-plane/backend/dispatch/review_gate.py，唯一真相源；
#     协议见 docs/workspace/review-record-protocol.md）。
#   新提交自动使旧审核失效（sha 对不上）；审核者事后改判
#   （补 changes-requested / blocked 标记）同样阻断。无记录 = 未审，不合入。
#   门禁脚本取自 main 检出（可信代码），不取 PR 分支的版本——PR 作者
#   不得自带门禁脚本。双门禁上线前，审核无权阻断合并（#127、#136 两次
#   竞态均因此发生）；上线后，REQUEST_CHANGES 的 PR 即使 CI 全绿也不会合入。
#
# 冒烟结果由 D:\02 本机 smoke-watcher 贴回：它在 D:\02 冒烟通过后贴评论并给该 PR 打 smoke-passed 标签
# （标签需先在仓库里建好；打标签用 GitHub API 或网页，不经过 Muse）。
#
# 触发（覆盖两种顺序）：
#   - PR 被打标签 / 有新提交 / 重新打开时评估本 PR；
#   - quality 工作流跑完时，重新评估所有 open PR（覆盖“先打标签、后 CI 变绿”的情况）。
#
# 安全阀：
#   - 只合 base 为 main、未关闭、非草稿的 PR；
#   - 有 do-not-merge 标签的一律不合；
#   - smoke-passed 必须绑定当前 head SHA（TASK-06-A #48）：watcher 冒烟通过时
#     在 PR 报告评论首行留机器可读标记
#     <!-- smoke-result: pr-<N> sha-<40位SHA> result=passed -->，
#     本工作流取最后一条 passed 标记的 SHA 与 PR 当前 head 比对；没有标记
#     或对不上，一律视为过期结果跳过。判定只读 GitHub 上的评论，不依赖
#     D:\02 本机进程在场（协议第二节补充规则：过期测试结果不得触发合并）；
#   - 要求 head 提交上 quality 的全部运行都已完成且结论为 success；
#   - 要求 head 提交上所有检查都已完成且结论为 success / skipped / neutral；
#   - 合并失败（冲突、分支不是最新、保护规则拦截）只记日志，不让本次运行变红。
#
# 合并方式：默认 merge 提交；带 merge-squash 标签的用 squash。
#
# 合并后显式触发下游（2026-11-14 修正；2026-11-18 加 status-view.yml）：
# 合并成功后向 auto-dispatch.yml、pr-merged-writeback.yml 与 status-view.yml
# 各 POST 一次 workflow dispatch（ref: main，inputs: pr_number）。必需的：
# auto-merge 用默认 GITHUB_TOKEN 合并，GitHub 不会为该 token 触发的事件再
# 启动新工作流，pull_request closed 事件被抑制，下游收不到合入事件
# （实测 PR #31 合入后两者均为 0 次运行）。
# workflow_dispatch 明确豁免这条限制，显式触发即可接通；不需要换 PAT、
# 不需要新 secret。dispatch 失败只记日志，不让合并作业变红（合并已发生）。
# 手动在网页上合并（用人 token）时 pull_request closed 事件正常触发，
# 两条路径都保留；下游工作流自身幂等，重复触发不重复评论/分派。
#
# TASK-07 扩展（2026-11-14）：新增 update-branches 作业——main 有新提交
# （push）或手动 dispatch 时，把落后的 agent/* 任务分支自动更新到最新
# main（PUT /pulls/{n}/update-branch，协议第六节定的机械动作）；有冲突
# 的分支不自动处理，由开发 Agent 自己 rebase。auto-merge 作业等它跑完
# 再评估（push 触发时），其余触发路径行为不变。
#
# 2026-11-24 流程提速批（用户定 B 档）：
#   - **update-branches 改为仅人工显式触发**。实测它把「main 前进」变成每个
#     在途 PR 的重跑循环：分支一更新就换 head，CI、冒烟、审核记录全部
#     作废重来（PR #242 三小时里重跑三遍）。分支保护未要求「必须最新」
#     （required_status_checks.strict=false），落后分支可直接合并；真有
#     冲突时 GitHub 的 mergeable=false 会拦住，由作者手动 rebase 或
#     `gh pr update-branch` 更新一次即可。需要批量更新时手动
#     `workflow_dispatch` 本工作流并勾选 update_branches=true（见下）。
#   - **审核门禁分级**：低风险 PR（改动小、无受保护路径、无 risk:high）
#     由 review_gate.py 判为 `REVIEW_TIER=waived`，免独立审核；仍必须过
#     CI 全绿 + smoke-passed 双门禁。免审会在 PR 上留一条绑定 head SHA 的
#     `<!-- review-waived: ... -->` 审计评论，不是静默放行。

name: auto-merge

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_run:
    workflows: ["quality"]
    types: [completed]
  workflow_dispatch:
    inputs:
      update_branches:
        description: "是否先更新落后的 agent/* 分支（默认否；会自动让 CI/冒烟/审核重跑）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  update-branches:
    # 2026-11-24：默认不跑。只有人工 dispatch 并显式勾选 update_branches
    # 才批量更新落后分支（更新会换 head，CI/冒烟/审核记录随之作废重跑）。
    if: github.event_name == 'workflow_dispatch' && inputs.update_branches == true
    runs-on: ubuntu-latest
    steps:
      - name: 自动更新落后的 agent 任务分支
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')

          PRS="$(curl -sS "${AUTH[@]}" "$API/pulls?state=open&base=main&per_page=100" | jq -r '.[].number')"
          for PR in $PRS; do
            PR_JSON="$(curl -sS "${AUTH[@]}" "$API/pulls/$PR")"
            HEAD_REF="$(echo "$PR_JSON" | jq -r '.head.ref')"
            DRAFT="$(echo "$PR_JSON" | jq -r '.draft')"
            MERGEABLE_STATE="$(echo "$PR_JSON" | jq -r '.mergeable_state')"

            case "$HEAD_REF" in
              agent/*) ;;
              *) echo "PR #$PR（$HEAD_REF）：非 agent/* 分支，作者自行更新，跳过"; continue ;;
            esac
            if [ "$DRAFT" = "true" ]; then echo "PR #$PR：草稿，跳过"; continue; fi
            if [ "$MERGEABLE_STATE" != "behind" ]; then
              echo "PR #$PR：mergeable_state=$MERGEABLE_STATE，非 behind，跳过"; continue
            fi

            echo "PR #$PR 落后于 main，调用 update-branch"
            HTTP_CODE="$(curl -sS -o /tmp/update.json -w '%{http_code}' -X PUT "${AUTH[@]}" "$API/pulls/$PR/update-branch")"
            case "$HTTP_CODE" in
              202) echo "PR #$PR 已更新（合并最新 main 进分支），CI 将自动重跑" ;;
              *) echo "PR #$PR 更新未成功（HTTP $HTTP_CODE）："; cat /tmp/update.json; echo; echo "只记录不报错——多为已有冲突，留给开发 Agent rebase。" ;;
            esac
          done
          echo "分支更新检查完成。"

  auto-merge:
    needs: update-branches
    if: always() && (needs.update-branches.result == 'success' || needs.update-branches.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # 检出 main 上的门禁脚本（可信代码）：review_gate.py 必须取 main 的
      # 版本，不取 PR 分支的——否则 PR 作者可以自己改门禁脚本放行自己。
      # 稀疏检出只要这一个文件；后续评估循环里每个 PR 都调它判定。
      - name: 检出 main 上的可信门禁脚本
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            apps/control-plane/backend/dispatch/review_gate.py
          sparse-checkout-cone-mode: false
      - name: 评估并自动合并符合条件的 PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')

          # 合并成功后显式触发下游工作流（见文件头注释）：auto-dispatch、
          # pr-merged-writeback 与 status-view 各一次 workflow dispatch。
          # dispatch 失败只记日志，不让合并作业变红——合并已发生，不可回滚；
          # 下游未触发时可在 Actions 页手动 dispatch（填 PR 号）补救。
          dispatch_downstream() {
            local pr="$1"
            local wf d_code
            for wf in auto-dispatch.yml pr-merged-writeback.yml status-view.yml; do
              d_code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST "${AUTH[@]}" "$API/actions/workflows/$wf/dispatches" -H 'Content-Type: application/json' --data-binary "{\"ref\": \"main\", \"inputs\": {\"pr_number\": \"$pr\"}}" || true)"
              case "$d_code" in
                204) echo "已触发 $wf（PR #$pr）" ;;
                *) echo "$wf 触发未成功（HTTP ${d_code:-无响应}）："; cat /tmp/dispatch.json 2>/dev/null || true; echo; echo "只记录不报错——下游工作流未触发，可在 Actions 页手动 dispatch（填 PR 号 $pr）补救。" ;;
              esac
            done
          }

          # 收集待评估的 PR 编号：pull_request 事件只看本 PR；
          # workflow_run 事件（quality 跑完）列出所有 open PR 逐个评估。
          if [ "$EVENT" = "pull_request" ]; then
            PRS="$PR_NUMBER"
          else
            PRS="$(curl -sS "${AUTH[@]}" "$API/pulls?state=open&per_page=100" | jq -r '.[].number')"
          fi

          for PR in $PRS; do
            echo "=== PR #$PR ==="
            PR_JSON="$(curl -sS "${AUTH[@]}" "$API/pulls/$PR")"
            STATE="$(echo "$PR_JSON" | jq -r '.state')"
            DRAFT="$(echo "$PR_JSON" | jq -r '.draft')"
            BASE="$(echo "$PR_JSON" | jq -r '.base.ref')"
            HEAD_SHA="$(echo "$PR_JSON" | jq -r '.head.sha')"
            MERGEABLE="$(echo "$PR_JSON" | jq -r '.mergeable')"
            LABELS="$(echo "$PR_JSON" | jq -r '.labels[].name')"

            has_label() { echo "$LABELS" | grep -qx "$1"; }

            if [ "$STATE" != "open" ]; then echo "已关闭，跳过"; continue; fi
            if [ "$DRAFT" = "true" ]; then echo "草稿，跳过"; continue; fi
            if [ "$BASE" != "main" ]; then echo "目标分支不是 main，跳过"; continue; fi
            if ! has_label 'smoke-passed'; then echo "没有 smoke-passed 标签，跳过"; continue; fi
            if has_label 'do-not-merge'; then echo "有 do-not-merge 标签，跳过"; continue; fi

            # smoke-passed 的 SHA 绑定校验（TASK-06-A #48）：标签本身不带 SHA，
            # 绑定记录在 watcher 贴的冒烟报告评论首行标记里。取最后一条
            # result=passed 标记的 SHA 与当前 head 比对；缺失或不一致 = 结果
            # 已过期（旧 head 冒烟通过后又推了新提交），不得合并。本判定只读
            # GitHub 评论，不依赖 D:\02 本机进程在场。
            SMOKE_SHA="$(curl -sS "${AUTH[@]}" "$API/issues/$PR/comments?per_page=100" | jq -r '[.[] | (.body // "") | capture("smoke-result: pr-[0-9]+ sha-(?<sha>[0-9a-f]{40}) result=passed"; "g") | .sha] | last // ""')"
            if [ -z "$SMOKE_SHA" ]; then echo "smoke-passed 没有 SHA 绑定标记（旧流程标签或标记缺失），跳过"; continue; fi
            if [ "$SMOKE_SHA" != "$HEAD_SHA" ]; then echo "smoke-passed 绑定的是旧 head $SMOKE_SHA，当前 head $HEAD_SHA，结果已过期，跳过"; continue; fi
            echo "smoke-passed 已绑定当前 head（$SMOKE_SHA），继续评估"

            # 独立审核门禁（Phase 2 P2-1 #131 / P2-3 #132；2026-11-24 分级）：
            # 先取 PR 评论里最后一条 review-result 标记判定；无记录、改判、
            # 旧 head、pr 不符一律不通过。低风险 PR（改动小、无受保护路径、
            # 无 risk:high）由门禁脚本直接判 waived 并打印 REVIEW_TIER=waived，
            # 此时免独立审核，但 CI + 冒烟双门禁仍然生效；免审会落一条绑定
            # head SHA 的审计评论，不是静默放行。脚本取自 main（可信代码）。
            if ! GATE_OUT="$(python3 apps/control-plane/backend/dispatch/review_gate.py --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA")"; then
              echo "$GATE_OUT"
              echo "独立审核门禁未通过，跳过"; continue
            fi
            echo "$GATE_OUT"
            # 免审标记先记下，审计评论等全部门禁通过、真正要合并时再写，
            # 避免「写了免审评论但 CI 后来红了」造成误导。
            WAIVED=0
            case "$GATE_OUT" in
              *REVIEW_TIER=waived*) WAIVED=1 ;;
            esac

            if [ "$MERGEABLE" = "false" ]; then echo "有冲突，跳过"; continue; fi

            # quality 的全部运行（push + pull_request）都必须完成且成功。
            QRUNS="$(curl -sS "${AUTH[@]}" "$API/actions/workflows/quality.yml/runs?head_sha=$HEAD_SHA&per_page=10")"
            Q_TOTAL="$(echo "$QRUNS" | jq -r '.total_count')"
            Q_BAD="$(echo "$QRUNS" | jq -r '[.workflow_runs[] | select(.status != "completed" or .conclusion != "success")] | length')"
            if [ "$Q_TOTAL" = "0" ]; then echo "quality 还没有运行记录，跳过"; continue; fi
            if [ "$Q_BAD" != "0" ]; then echo "quality 未全绿，跳过"; continue; fi

            # head 提交上的全部检查都必须完成，且结论为 success / skipped / neutral。
            # 注意：排除本工作流自身的检查运行（name 为 auto-merge）——它在评估
            # 进行时正处于 in_progress，若算进去，labeled 触发的运行会永远因
            # “自己没跑完”而跳过（2026-11-13 PR #14 实测：run #37/#39 均因此
            # 跳过，而提交页上其余检查全绿）。合并的安全性仍由 quality 全绿
            # 与 smoke-passed 标签保证，不依赖本工作流自身的检查结论。
            CHECKS="$(curl -sS "${AUTH[@]}" "$API/commits/$HEAD_SHA/check-runs?per_page=100")"
            C_TOTAL="$(echo "$CHECKS" | jq -r '.total_count')"
            C_BAD="$(echo "$CHECKS" | jq -r '[.check_runs[] | select(.name != "auto-merge") | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')"
            if [ "$C_TOTAL" = "0" ]; then echo "没有任何检查记录，跳过"; continue; fi
            if [ "$C_BAD" != "0" ]; then echo "有检查未通过或未完成，跳过"; continue; fi

            # 低风险免审：合并前落一条绑定 head SHA 的审计评论（幂等）。
            if [ "$WAIVED" = "1" ]; then
              WAIVER_MARKER="<!-- review-waived: pr-$PR sha-$HEAD_SHA reason=low-risk -->"
              if curl -sS "${AUTH[@]}" "$API/issues/$PR/comments?per_page=100" | grep -qF "review-waived: pr-$PR sha-$HEAD_SHA"; then
                echo "免审审计评论已存在，不重复写"
              else
                WAIVER_BODY="$(printf '%s\n%s' "$WAIVER_MARKER" "低风险免审：改动规模在阈值内、未触及受保护路径、无 risk:high 标签，按 2026-11-24 流程提速批免独立审核；仍须 CI 全绿 + smoke-passed 双门禁。")"
                if curl -sS -o /dev/null -X POST "${AUTH[@]}" "$API/issues/$PR/comments" \
                    -H 'Content-Type: application/json' \
                    --data-binary "$(jq -n --arg b "$WAIVER_BODY" '{body:$b}')"; then
                  echo "已写入免审审计评论（head $HEAD_SHA）"
                else
                  echo "免审审计评论写入失败（只记录，不影响合并判定）"
                fi
              fi
            fi

            # 合并方式：带 merge-squash 标签用 squash，否则用 merge 提交。
            if has_label 'merge-squash'; then METHOD='squash'; else METHOD='merge'; fi
            echo "条件满足，合并 PR #$PR（方式：$METHOD，head：$HEAD_SHA）"
            HTTP_CODE="$(curl -sS -o /tmp/merge.json -w '%{http_code}' -X PUT "${AUTH[@]}" "$API/pulls/$PR/merge" -H 'Content-Type: application/json' --data-binary "{\"merge_method\": \"$METHOD\", \"sha\": \"$HEAD_SHA\"}")"
            case "$HTTP_CODE" in
              200) echo "PR #$PR 已合并。"; dispatch_downstream "$PR" ;;
              *) echo "合并未成功（HTTP $HTTP_CODE）："; cat /tmp/merge.json; echo; echo "本次只记录，不报错——可能原因：分支不是最新、保护规则拦截，处理后下次触发会再试。" ;;
            esac
          done
          echo "评估完成。"
